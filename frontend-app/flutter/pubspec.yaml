name: driveapp
description: A ride-sharing mobile application for drivers and riders
version: 2.4.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # HTTP
  http: ^1.1.0

  # Local storage (auth persistence)
  shared_preferences: ^2.2.2

  # UI Components
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0

  # Icons
  lucide_icons: ^0.257.0

  # Real-time WebSocket (Pusher Channels)
  pusher_channels_flutter: ^2.4.0

  # Phone / URL launching
  url_launcher: ^6.2.0

  # Push notifications (mobile background)
  pusher_beams: ^1.1.2

  # Utils
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
